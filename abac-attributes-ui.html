<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABAC — Attributes · Freight Tiger</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box}
</style>
</head>
<body>
<style>
/* ============================================================
   ABAC — Attribute-Based Access Control · Freight Tiger prototype
   Design tokens
   ============================================================ */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --surface-3:#EEF2F7;
  --ink:#1E2A3B; --ink-2:#5A6779; --ink-3:#8A94A6;
  --line:#E4E8EF; --line-strong:#D3D9E3;
  --primary:#2E3A56; --primary-hover:#3B496B; --primary-ink:#FFFFFF;
  --accent:#F5C518; --accent-ink:#1E2A3B;
  --thead:#818FA9; --thead-ink:#FFFFFF;
  --focus:#4C6FE0;
  --good:#2F9E5B; --good-bg:#E6F4EC;
  --warn:#C77C1E; --warn-bg:#FBF0DF;
  --danger:#D64545; --danger-bg:#FBE7E7;
  --shadow-sm:0 1px 2px rgba(24,36,54,.06),0 1px 3px rgba(24,36,54,.05);
  --shadow-md:0 6px 20px rgba(24,36,54,.10),0 2px 6px rgba(24,36,54,.06);
  --shadow-lg:0 18px 50px rgba(18,26,40,.22);
  --r-sm:7px; --r-md:11px; --r-lg:16px; --r-pill:999px;
  --nav-h:60px; --maxw:1240px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E131B; --surface:#161D28; --surface-2:#1B2430; --surface-3:#212C3A;
    --ink:#E8EDF4; --ink-2:#A4B0C2; --ink-3:#71809A;
    --line:#273244; --line-strong:#33415A;
    --primary:#41548A; --primary-hover:#4E639E; --primary-ink:#F3F6FC;
    --accent:#F5C518; --accent-ink:#1E2A3B;
    --thead:#33415A; --thead-ink:#DCE4F1;
    --focus:#6E8CF0;
    --good:#4FCB84; --good-bg:#15301F;
    --warn:#E6A94D; --warn-bg:#332512;
    --danger:#F0736F; --danger-bg:#331A1A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 8px 24px rgba(0,0,0,.5);
    --shadow-lg:0 20px 54px rgba(0,0,0,.62);
  }
}
:root[data-theme="light"]{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --surface-3:#EEF2F7;
  --ink:#1E2A3B; --ink-2:#5A6779; --ink-3:#8A94A6;
  --line:#E4E8EF; --line-strong:#D3D9E3;
  --primary:#2E3A56; --primary-hover:#3B496B; --primary-ink:#FFFFFF;
  --thead:#818FA9; --thead-ink:#FFFFFF; --focus:#4C6FE0;
  --good:#2F9E5B; --good-bg:#E6F4EC; --warn:#C77C1E; --warn-bg:#FBF0DF;
  --danger:#D64545; --danger-bg:#FBE7E7;
  --shadow-sm:0 1px 2px rgba(24,36,54,.06),0 1px 3px rgba(24,36,54,.05);
  --shadow-md:0 6px 20px rgba(24,36,54,.10),0 2px 6px rgba(24,36,54,.06);
  --shadow-lg:0 18px 50px rgba(18,26,40,.22);
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1B2430; --surface-3:#212C3A;
  --ink:#E8EDF4; --ink-2:#A4B0C2; --ink-3:#71809A;
  --line:#273244; --line-strong:#33415A;
  --primary:#41548A; --primary-hover:#4E639E; --primary-ink:#F3F6FC;
  --thead:#33415A; --thead-ink:#DCE4F1; --focus:#6E8CF0;
  --good:#4FCB84; --good-bg:#15301F; --warn:#E6A94D; --warn-bg:#332512;
  --danger:#F0736F; --danger-bg:#331A1A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 20px 54px rgba(0,0,0,.62);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:14px; line-height:1.5;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Top navigation ---------- */
.nav{
  position:sticky; top:0; z-index:50; height:var(--nav-h);
  display:flex; align-items:center; gap:14px; padding:0 22px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.nav-apps{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2);flex:0 0 auto;cursor:pointer;
}
.brand{display:flex;align-items:center;gap:9px}
.brand .bolt{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#1E2A3B}
.brand .wm{font-weight:800;letter-spacing:.16em;font-size:13px;color:var(--ink)}
.nav-spacer{flex:1}
.nav-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);background:transparent;border:none;cursor:pointer}
.nav-ico:hover{background:var(--surface-2)}
.tenant{display:flex;align-items:center;gap:9px;padding:5px 8px 5px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface-2)}
.tenant b{font-weight:800;color:#1466B8;font-size:14px;letter-spacing:.01em}
.tenant .sub{color:var(--ink-2);font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#5A6B94,#2E3A56);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}

/* ---------- Layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:26px 22px 80px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-title{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.page-title .ph-ico{width:30px;height:30px;color:var(--primary)}
.head-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px;
  padding:10px 16px;border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;
  transition:background .14s,box-shadow .14s,border-color .14s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn-quiet{background:transparent;color:var(--ink-2);border-color:transparent}
.btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.count{font-weight:800;font-size:14.5px;color:var(--ink)}
.count .n{color:var(--primary)}
:root[data-theme="dark"] .count .n{color:#8FA6E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .count .n{color:#8FA6E6}}
.tools-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:var(--ink-3);pointer-events:none}
.search input{width:340px;max-width:52vw;padding:10px 14px 10px 38px;border:1px solid var(--line-strong);
  border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font-size:13.5px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.icon-btn{width:40px;height:40px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;cursor:pointer;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.on{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.filter-dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

/* ---------- Filter bar ---------- */
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 14px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.filterbar .fl-label{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px}
.seg button{border:none;background:transparent;color:var(--ink-2);font-weight:650;font-size:12.5px;padding:6px 13px;border-radius:var(--r-pill);cursor:pointer}
.seg button.on{background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow-sm)}

/* ---------- Table ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.table-scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:separate;border-spacing:0;min-width:920px}
table.grid thead th{background:var(--thead);color:var(--thead-ink);text-align:left;font-weight:700;font-size:12px;
  letter-spacing:.04em;padding:14px 18px;position:sticky;top:0;white-space:nowrap}
table.grid thead th:first-child{border-top-left-radius:0}
table.grid tbody td{padding:15px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
table.grid tbody tr:last-child td{border-bottom:none}
table.grid tbody tr{transition:background .12s}
table.grid tbody tr:hover{background:var(--surface-2)}
.cell-name{font-weight:700;color:var(--ink);font-size:14px}
.cell-name .sub{font-weight:500;color:var(--ink-3);font-size:12px;margin-top:2px}
.num{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.by{color:var(--ink);font-weight:650}
.by .sub{color:var(--ink-3);font-weight:500;font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:7px;justify-content:flex-end}
.act{width:34px;height:34px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;cursor:pointer;transition:.12s}
.act:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.act.danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:var(--r-pill);
  border:1px solid color-mix(in srgb,var(--hue,#818FA9) 30%,transparent);
  background:color-mix(in srgb,var(--hue,#818FA9) 15%,var(--surface));
  color:color-mix(in srgb,var(--hue,#818FA9) 62%,var(--ink));line-height:1.35}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--hue,#818FA9)}
.chip-lv{--hue:#5A6B94}
.chip-lv.company{--hue:#3E82C4}
.chip-lv.branch{--hue:#C77C1E}
.chip-lv.group{--hue:#7048C4}
.scope-more{color:var(--ink-3);font-size:12px;font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.scope-wrap{display:flex;align-items:center;gap:2px;flex-wrap:wrap}

/* entity hues */
.e-place{--hue:#14A69A}.e-route{--hue:#5877E8}.e-material{--hue:#CE9328}
.e-vehicle_type{--hue:#8A63EA}.e-route_master{--hue:#1AA1BC}.e-related_entity{--hue:#DB5488}

/* ---------- Popover menu ---------- */
.menu{position:absolute;z-index:70;min-width:172px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:6px;right:0;top:44px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;
  color:var(--ink);font-size:13px;font-weight:600;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu button.danger:hover{background:var(--danger-bg)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}

/* ---------- Empty state ---------- */
.empty{padding:64px 24px;text-align:center;color:var(--ink-2)}
.empty .em-ico{width:56px;height:56px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;margin:0 auto 16px;color:var(--ink-3)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:16px}

/* ---------- Stepper ---------- */
.subhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.back:hover{background:var(--surface-2);color:var(--ink)}
.subhead h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.stepper{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin:6px 0 26px}
.step .bar{height:6px;border-radius:var(--r-pill);background:var(--line);overflow:hidden}
.step .bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:inherit;transition:width .4s ease}
.step.done .bar i,.step.active .bar i{width:100%}
.step .lbl{margin-top:12px;font-weight:750;font-size:15px;color:var(--ink-3);display:flex;align-items:center;gap:9px}
.step.active .lbl,.step.done .lbl{color:var(--ink)}
.step .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-strong)}
.step.active .sn,.step.done .sn{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ---------- Forms ---------- */
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.form-body{padding:26px}
.form-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 26px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.field{margin-bottom:20px;max-width:640px}
.field:last-child{margin-bottom:0}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px}
label.lb .req{color:var(--danger);margin-right:3px}
label.lb .opt{color:var(--ink-3);font-weight:500;margin-left:4px}
.inp{width:100%;padding:11px 14px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);
  color:var(--ink);font-size:14px;transition:border-color .14s,box-shadow .14s}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
textarea.inp{resize:vertical;min-height:46px}
.hint{font-size:12px;color:var(--ink-3);margin-top:7px}
.err{font-size:12px;color:var(--danger);margin-top:7px;font-weight:600;display:none}
.field.invalid .inp{border-color:var(--danger)}
.field.invalid .err{display:block}

/* radios */
.radios{display:flex;gap:12px;flex-wrap:wrap}
.radio{flex:1;min-width:170px;display:flex;gap:11px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line-strong);
  border-radius:var(--r-md);cursor:pointer;background:var(--surface);transition:.14s}
.radio:hover{border-color:var(--ink-3)}
.radio.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--surface));box-shadow:var(--shadow-sm)}
.radio .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;transition:.14s}
.radio.on .rd{border-color:var(--primary)}
.radio.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--primary)}
.radio .rt{display:block;font-weight:700;font-size:14px}
.radio .rs{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

/* ---------- Multi-select ---------- */
.ms{position:relative}
.ms-control{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;padding:7px 40px 7px 10px;
  border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);cursor:text;position:relative}
.ms-control:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.ms-control .ph{color:var(--ink-3);font-size:13.5px;padding:4px 4px}
.ms-control input{flex:1;min-width:80px;border:none;outline:none;background:transparent;color:var(--ink);font-size:13.5px;padding:4px}
.ms-caret{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--hue,#5A6B94) 14%,var(--surface));
  color:color-mix(in srgb,var(--hue,#5A6B94) 60%,var(--ink));border:1px solid color-mix(in srgb,var(--hue,#5A6B94) 26%,transparent);
  padding:3px 6px 3px 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:650;max-width:100%}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag button{border:none;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;opacity:.7;padding:0;width:16px;height:16px;border-radius:50%}
.tag button:hover{opacity:1;background:color-mix(in srgb,var(--hue,#5A6B94) 22%,transparent)}
.ms-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-md);box-shadow:var(--shadow-md);max-height:290px;overflow:auto;padding:6px}
.ms-opt{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer}
.ms-opt:hover{background:var(--surface-2)}
.ms-opt .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);flex:0 0 auto;display:grid;place-items:center;color:#fff;transition:.12s}
.ms-opt.sel .ck{background:var(--primary);border-color:var(--primary)}
.ms-opt .ol{font-weight:650;font-size:13.5px;color:var(--ink)}
.ms-opt .os{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ms-opt .osel{margin-left:auto;font-size:11px;color:var(--good);font-weight:700}
.ms-none{padding:16px;text-align:center;color:var(--ink-3);font-size:13px}
.ms-hint{padding:9px 11px;color:var(--ink-3);font-size:11.5px;border-top:1px solid var(--line);margin-top:4px;line-height:1.4}

/* ---------- Mapping accordions ---------- */
.map-intro{display:flex;align-items:flex-start;gap:12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px;color:var(--ink-2);font-size:13px}
.map-intro svg{color:var(--primary);flex:0 0 auto;margin-top:1px}
:root[data-theme="dark"] .map-intro svg{color:#8FA6E6}
.acc{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:12px;overflow:visible;box-shadow:var(--shadow-sm)}
.acc-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none}
.acc-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--hue) 14%,var(--surface));color:color-mix(in srgb,var(--hue) 58%,var(--ink));
  border:1px solid color-mix(in srgb,var(--hue) 26%,transparent)}
.acc-tt{flex:1;min-width:0}
.acc-tt .t{font-weight:750;font-size:14.5px;color:var(--ink)}
.acc-tt .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.acc-badge{font-size:12px;font-weight:750;padding:4px 11px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--hue) 15%,var(--surface));color:color-mix(in srgb,var(--hue) 60%,var(--ink));
  border:1px solid color-mix(in srgb,var(--hue) 28%,transparent);white-space:nowrap;font-variant-numeric:tabular-nums}

  const si=$('#searchInp');
  si.oninput = e=>{ listState.q=e.target.value; const c=si.selectionStart; renderList(); const n=$('#searchInp'); n.focus(); n.setSelectionRange(c,c); };
  $('#filterBtn').onclick = ()=>{ listState.showFilter=!listState.showFilter; renderList(); };
  if(listState.showFilter){
    $('#levelSeg').querySelectorAll('button').forEach(b=> b.onclick=()=>{ listState.level=b.dataset.l; renderList(); });
    const cf=$('#clearFilter'); if(cf) cf.onclick=()=>{ listState.level='all'; renderList(); };
  }
  app.querySelectorAll('[data-open]').forEach(el=> el.onclick=()=> openDetail(el.dataset.open));
  app.querySelectorAll('[data-edit]').forEach(el=> el.onclick=e=>{ e.stopPropagation(); openDetail(el.dataset.edit); });
  app.querySelectorAll('[data-del]').forEach(el=> el.onclick=e=>{ e.stopPropagation(); delAttr(el.dataset.del); });
  app.querySelectorAll('[data-menu]').forEach(el=> el.onclick=e=>{ e.stopPropagation(); openRowMenu(e.currentTarget, el.dataset.menu); });
}

function rowHTML(a){
  return `<tr>
    <td data-open="${a.id}" style="cursor:pointer"><div class="cell-name">${esc(a.name)}<div class="sub">${esc(a.description||'—')}</div></div></td>
    <td>${scopeCell(a)}</td>
    <td><span class="num">${mapTotal(a)} items</span></td>
    <td><div class="by">${esc(a.createdBy)}<div class="sub">${esc(a.createdAt)}</div></div></td>
    <td>
      <div class="row-actions">
        <button class="act" data-edit="${a.id}" title="Edit" aria-label="Edit ${esc(a.name)}">${I.pencil}</button>
        <button class="act danger" data-del="${a.id}" title="Delete" aria-label="Delete ${esc(a.name)}">${I.trash}</button>
        <button class="act" data-menu="${a.id}" title="More" aria-label="More actions">${I.dots}</button>
      </div>
    </td>
  </tr>`;
}
function emptyHTML(){
  return `<div class="empty"><div class="em-ico">${I.search}</div>
    <h3>No attributes match</h3><div>Try a different name or clear the level filter.</div></div>`;
}

/* row overflow menu */
function closeMenus(){ document.querySelectorAll('.menu').forEach(m=>m.remove()); }
function openRowMenu(btn,id){
  const existing=btn.parentElement.querySelector('.menu');
  closeMenus(); if(existing) return;
  const a=ATTRS.find(x=>x.id===id);
  const m=document.createElement('div'); m.className='menu';
  m.innerHTML=`<button data-a="view">${I.eye} Open</button>
    <button data-a="dup">${I.copy} Duplicate</button><div class="sep"></div>
    <button class="danger" data-a="del">${I.trash} Delete</button>`;
  btn.parentElement.style.position='relative'; btn.parentElement.appendChild(m);
  m.querySelector('[data-a="view"]').onclick=()=>{closeMenus();openDetail(id);};
  m.querySelector('[data-a="dup"]').onclick=()=>{closeMenus();dupAttr(id);};
  m.querySelector('[data-a="del"]').onclick=()=>{closeMenus();delAttr(id);};
}
document.addEventListener('click',()=>closeMenus());

function delAttr(id){
  const a=ATTRS.find(x=>x.id===id); if(!a) return;
  ATTRS = ATTRS.filter(x=>x.id!==id);
  toast(`Deleted “${a.name}”`);
  if(VIEW==='list') renderList(); else go('list');
}
function dupAttr(id){
  const a=ATTRS.find(x=>x.id===id); if(!a) return;
  const copy=JSON.parse(JSON.stringify(a)); copy.id=nid(); copy.name=a.name+' (copy)';
  copy.createdBy='Devendra Singh'; copy.createdAt=todayStr();
  ATTRS.unshift(copy); toast(`Duplicated “${a.name}”`); renderList();
}

/* ============================================================
   Create / Edit — Step 1 (details)
   ============================================================ */
function blankDraft(){
  return {id:null,name:'',description:'',level:'company',scopes:[],
    map:{place:[],route:[],material:[],vehicle_type:[],route_master:[],related_entity:[]},
    editing:false};
}
function startCreate(){ draft=blankDraft(); go('create1'); }

function renderStep1(){
  const d=draft;
  app.innerHTML=`
    <div class="subhead">
      <button class="back" id="back" aria-label="Back">${I.chevL}</button>
      <div>
        <h1>${d.editing?'Edit attribute':'Create attribute'}</h1>
        ${d.editing&&d.createdBy?`<div class="subhead-meta">Created by ${esc(d.createdBy)} · ${esc(d.createdAt)}</div>`:''}
      </div>
    </div>
    <div class="stepper">
      <div class="step active"><div class="bar"><i></i></div><div class="lbl"><span class="sn">1</span> ${d.editing?'Attribute details':'Create attribute'}</div></div>
      <div class="step ${d.editing?'done':''}"><div class="bar"><i></i></div><div class="lbl"><span class="sn">${d.editing?I.check:'2'}</span> ${d.editing?'Mapping':'Create mapping'}</div></div>
    </div>

    <div class="form-card">
      <div class="form-body">
        <div class="field" id="f-name">
          <label class="lb"><span class="req">*</span>Attribute name</label>
          <input class="inp" id="in-name" placeholder="Type..." value="${esc(d.name)}" maxlength="60" autocomplete="off">
          <div class="err">Attribute name is required.</div>
        </div>
        <div class="field">
          <label class="lb">Description <span class="opt">(Optional)</span></label>
          <textarea class="inp" id="in-desc" placeholder="Type..." rows="2" maxlength="160">${esc(d.description)}</textarea>
        </div>
        <div class="field">
          <label class="lb"><span class="req">*</span>Onboarding level</label>
          <div class="radios" id="levels">
            ${[['company','Company level','Applies across the whole company'],
               ['group','Group level','Applies to selected branch groups'],
               ['branch','Branch level','Applies to specific branches']]
              .map(([k,t,s])=>`<label class="radio ${d.level===k?'on':''}" data-lv="${k}">
                <span class="rd"></span><span><span class="rt">${t}</span><span class="rs">${s}</span></span></label>`).join('')}
          </div>
        </div>
        <div class="field" id="scopeField" style="${d.level==='company'?'display:none':''}">
          <label class="lb"><span class="req">*</span>${d.level==='group'?'Select groups':'Select branches'}</label>
          <div id="scopeMount"></div>
          <div class="hint">Choose the ${d.level==='group'?'group':'branch'} this attribute is onboarded under.</div>
        </div>
      </div>
      <div class="form-foot">
        <button class="btn btn-ghost" id="cancel">Cancel</button>
        ${d.editing
          ? `<button class="btn btn-ghost" id="toMap">Mapping ${I.chevR}</button><button class="btn btn-primary" id="save1">Save changes</button>`
          : `<button class="btn btn-primary" id="next">Create attribute ${I.chevR}</button>`}
      </div>
    </div>
  `;
  $('#back').onclick=()=>go('list');
  $('#cancel').onclick=()=>go('list');
  $('#in-name').oninput=e=>{ d.name=e.target.value; $('#f-name').classList.remove('invalid'); };
  $('#in-desc').oninput=e=> d.description=e.target.value;

  $('#levels').querySelectorAll('.radio').forEach(r=> r.onclick=()=>{
    d.level=r.dataset.lv; d.scopes=[]; renderStep1();
  });
  if(d.level!=='company') mountScopeSelect();

  const goMap=()=>{ if(validateDraft()) go('create2'); };
  $('#next')?.addEventListener('click',goMap);
  $('#toMap')?.addEventListener('click',goMap);
  $('#save1')?.addEventListener('click',saveDraft);
}
function mountScopeSelect(){
  const opts=(draft.level==='group'?GROUPS:BRANCHES).map(o=>({id:o.id,label:o.label,sub:''}));
  multiSelect($('#scopeMount'),{options:opts,selected:draft.scopes,hue:'#5A6B94',single:true,
    placeholder:draft.level==='group'?'Select a group...':'Select a branch...',
    onChange:sel=>{draft.scopes=sel;}});
}

/* ============================================================
   Create / Edit — Step 2 (mapping)
   ============================================================ */
let accOpen = 'place';
function renderStep2(){
  const d=draft;
  app.innerHTML=`
    <div class="subhead">
      <button class="back" id="back" aria-label="Back">${I.chevL}</button>
      <h1>${d.editing?'Edit mapping':'Create mapping'} <span style="color:var(--ink-3);font-weight:600;font-size:15px">· ${esc(d.name)}</span></h1>
    </div>
    <div class="stepper">
      <div class="step done"><div class="bar"><i></i></div><div class="lbl"><span class="sn">${I.check}</span> ${d.editing?'Attribute details':'Create attribute'}</div></div>
      <div class="step active"><div class="bar"><i></i></div><div class="lbl"><span class="sn">2</span> ${d.editing?'Mapping':'Create mapping'}</div></div>
    </div>

    <div class="map-intro">${I.info}<div>Map this attribute to the master-data records it should govern. Pick as many as you need in each category — <b>Place, Route, Material, Vehicle type, Route master</b> and <b>Related entity</b> all support multi-select.</div></div>

    <div id="accs"></div>

    <div class="form-card" style="margin-top:18px">
      <div class="form-foot" style="border-radius:var(--r-lg);border-top:none;justify-content:space-between">
        <div style="color:var(--ink-2);font-weight:650;font-size:13.5px">${mapTotal(d)} master-data records mapped</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost" id="back2">${I.chevL} Back</button>
          <button class="btn btn-primary" id="save">${d.editing?'Save changes':'Create attribute'}</button>
        </div>
      </div>
    </div>
  `;
  $('#back').onclick=()=>go('create1');
  $('#back2').onclick=()=>go('create1');
  $('#save').onclick=saveDraft;

  const host=$('#accs');
  ENTITIES.forEach(e=>{
    const wrap=document.createElement('div');
    wrap.className='acc'+(accOpen===e.key?' open':'');
    wrap.style.setProperty('--hue',e.hue);
    const cnt=d.map[e.key].length;
    wrap.innerHTML=`
      <div class="acc-head" data-k="${e.key}">
        <div class="acc-ico">${I[e.key]}</div>
        <div class="acc-tt"><div class="t">${e.label}</div><div class="d">${e.desc}</div></div>
        <span class="acc-badge ${cnt?'':'zero'}">${cnt} selected</span>
        <span class="acc-chev">${I.chevD}</span>
      </div>
      <div class="acc-body"><div class="acc-body-inner"><div class="ms-mount"></div></div></div>`;
    host.appendChild(wrap);
    wrap.querySelector('.acc-head').onclick=()=>{ accOpen = accOpen===e.key? null : e.key; renderStep2(); };
    if(accOpen===e.key){
      multiSelect(wrap.querySelector('.ms-mount'),{
        options:CATALOG[e.key],selected:d.map[e.key],hue:e.hue,
        placeholder:`Search ${e.label.toLowerCase()}...`,openInitially:true,
        onChange:sel=>{ d.map[e.key]=sel; wrap.querySelector('.acc-badge').textContent=`${sel.length} selected`;
          wrap.querySelector('.acc-badge').classList.toggle('zero',sel.length===0);
          const foot=$('#save').closest('.form-foot').querySelector('div'); foot.textContent=`${mapTotal(d)} master-data records mapped`; }
      });
    }
  });
}

function validateDraft(){
  const d=draft;
  if(!d.name.trim()){ $('#f-name')?.classList.add('invalid'); $('#in-name')?.focus(); return false; }
  if(d.level!=='company' && d.scopes.length===0){ toast(`Select a ${d.level}`); return false; }
  return true;
}
function saveDraft(){
  if(!validateDraft()) return;
  const d=draft;
  if(d.editing){
    const a=ATTRS.find(x=>x.id===d.id);
    Object.assign(a,{name:d.name,description:d.description,level:d.level,scopes:d.scopes,map:d.map});
    toast(`Saved “${d.name}” · ${mapTotal(a)} records mapped`);
  }else{
    const a={id:nid(),name:d.name,description:d.description,level:d.level,scopes:d.scopes,
      createdBy:'Devendra Singh',createdAt:todayStr(),map:d.map};
    ATTRS.unshift(a); toast(`Created “${a.name}” · ${mapTotal(a)} records mapped`);
  }
  go('list');
}

/* ============================================================
   Reusable multi-select
   ============================================================ */
const MS_MAX_RENDER=50;
function multiSelect(mount,{options,selected,hue='#5A6B94',placeholder='Search...',onChange,openInitially=false,single=false}){
  let open=openInitially, q='';
  mount.innerHTML=`<div class="ms"><div class="ms-control" tabindex="-1"></div></div>`;
  const root=mount.querySelector('.ms');
  root.style.setProperty('--hue',hue);
  const control=root.querySelector('.ms-control');

  function draw(){
    const chips=selected.map(id=>{
      const o=options.find(x=>x.id===id)||{id,label:id};
      return `<span class="tag"><span>${esc(o.label)}</span><button data-rm="${id}" aria-label="Remove ${esc(o.label)}">${I.x}</button></span>`;
    }).join('');
    control.innerHTML=`${chips}<input placeholder="${selected.length?'':esc(placeholder)}" value="${esc(q)}" aria-label="${esc(placeholder)}"><span class="ms-caret">${I.chevD}</span>`;
    control.querySelectorAll('[data-rm]').forEach(b=> b.onclick=ev=>{ ev.stopPropagation();
      selected.splice(selected.indexOf(b.dataset.rm),1); onChange&&onChange(selected.slice()); draw(); });
    const inp=control.querySelector('input');
    inp.oninput=e=>{ q=e.target.value; open=true; drawPop(); };
    inp.onfocus=()=>{ open=true; drawPop(); };
    control.onclick=e=>{ if(e.target===control){ inp.focus(); open=true; drawPop(); } };
    if(open){ inp.focus({preventScroll:true}); const L=inp.value.length; inp.setSelectionRange(L,L); }
    drawPop();
  }
  function drawPop(){
    root.querySelector('.ms-pop')?.remove();
    if(!open) return;
    const ql=q.trim().toLowerCase();
    const matches=options.filter(o=> !ql || o.label.toLowerCase().includes(ql) || (o.sub||'').toLowerCase().includes(ql));
    const list=matches.slice(0,MS_MAX_RENDER);
    const pop=document.createElement('div'); pop.className='ms-pop';
    if(!matches.length){ pop.innerHTML=`<div class="ms-none">No matches for “${esc(q)}”</div>`; }
    else{
      pop.innerHTML=list.map(o=>{ const on=selected.includes(o.id);
        return `<div class="ms-opt ${on?'sel':''}" data-id="${o.id}">
          <span class="ck">${on?I.check:''}</span>
          <span><span class="ol">${esc(o.label)}</span>${o.sub?`<span class="os">${esc(o.sub)}</span>`:''}</span>
          ${on?'<span class="osel">Added</span>':''}</div>`; }).join('')
        + (matches.length>MS_MAX_RENDER?`<div class="ms-hint">Showing first ${MS_MAX_RENDER} of ${matches.length.toLocaleString()} — keep typing to narrow the list.</div>`:'');
    }
    root.appendChild(pop);
    pop.querySelectorAll('.ms-opt').forEach(el=> el.onclick=ev=>{ ev.stopPropagation();
      const id=el.dataset.id; const i=selected.indexOf(id);
      if(single){ selected.length=0; if(i<0) selected.push(id); open=false; }
      else { if(i>=0) selected.splice(i,1); else selected.push(id); }
      onChange&&onChange(selected.slice()); draw(); });
  }
  // Attach the outside-click listener on the next tick so the very click that
  // opened this control (e.g. an accordion header or the "next" button) doesn't
  // bubble to document and immediately close the popup.
  function onDoc(e){
    if(!root.isConnected){ document.removeEventListener('click',onDoc); return; }
    if(!root.contains(e.target)){ if(open){ open=false; drawPop(); } }
  }
  setTimeout(()=>document.addEventListener('click',onDoc),0);
  draw();
}

/* ============================================================
   Open an attribute — view & edit share the same editor screen
   (the details + mapping wizard), so there is a single UI to build.
   ============================================================ */
function openDetail(id){
  const a=ATTRS.find(x=>x.id===id); if(!a) return;
  draft=cloneToDraft(a); go('create1');
}
function cloneToDraft(a){
  const d=JSON.parse(JSON.stringify(a)); d.editing=true; return d;
}

/* ============================================================
   Theme toggle
   ============================================================ */
function currentTheme(){ return document.documentElement.getAttribute('data-theme')
  || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }
function paintThemeBtn(){ $('#themeBtn').innerHTML = currentTheme()==='dark'? I.sun : I.moon; }
$('#themeBtn').onclick=()=>{ const next=currentTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next); paintThemeBtn(); };
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',paintThemeBtn);
paintThemeBtn();

/* boot */
render();
</script>
